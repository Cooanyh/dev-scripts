name: Build ChaoxingSignFaker without Umeng

on:
  push:
    branches:
      - build/chaoxingsignfaker-no-umeng-20261106
    paths:
      - 'chaoxingsignfaker/**'
      - '.github/workflows/chaoxingsignfaker-no-umeng.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: aquamarine5/ChaoxingSignFaker
          ref: 071c2e07239b16b690d5eef01f8c514ab7a31d9c
          path: upstream
          persist-credentials: false

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 37.0
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'

      - name: Apply no-Umeng patch
        run: |
          python3 chaoxingsignfaker/remove_umeng.py upstream
          ! grep -R -nE 'com\.umeng\.|MobclickAgent|UMConfigure\.getOaid' upstream/app/src/main/java
          grep -q 'android.intent.category.LAUNCHER' upstream/app/src/main/AndroidManifest.xml

      - name: Apply Course Check-in Assistant name and icon
        run: |
          python3 -m pip install --disable-pip-version-check cairosvg
          python3 chaoxingsignfaker/brand_course_assistant.py upstream
          grep -q '课程签到助手' upstream/app/src/main/res/values/strings.xml
          test -s upstream/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png


      - name: Gradle debug build
        working-directory: upstream
        env:
          # GitHub Packages owner may require separate package access rights.
          GHP_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Check compiled APK for Umeng components
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path('upstream/app/build/outputs/apk/debug/app-debug.apk')
          assert apk.exists(), 'Missing APK'
          flags=[b'Lcom/umeng/',b'com/umeng/',b'Lcom/efs/',b'Lcom/uc/crashsdk/']
          with zipfile.ZipFile(apk) as z:
              for path in z.namelist():
                  if path.endswith('.dex'):
                      data=z.read(path)
                      for flag in flags:
                          assert flag not in data, f'Remaining SDK reference: {flag} in {path}'
                  assert 'umeng' not in path.lower(), f'Remaining SDK asset: {path}'
          print('PASS: no common Umeng class/SDK traces; size:',apk.stat().st_size)
          PY

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CourseCheckinAssistant-NoUmeng-debug-apk
          path: upstream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="course-checkin-assistant-1.19.4-no-umeng-20261106"
          APK="CourseCheckinAssistant-1.19.4-NoUmeng-debug.apk"
          cp upstream/app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --target "$GITHUB_SHA" \
              --title "课程签到助手 1.19.4 | 去友盟版 (非官方)" \
              --notes "非官方个人修改版，源自 aquamarine5/ChaoxingSignFaker，遵循原 AGPL-3.0 协议并保留作者署名。替换应用名称与青蓝签到图标，移除友盟 SDK，保留本地签到统计。Debug 签名，未做真机测试，无法保证覆盖安装；Sentry/Supabase 等第三方功能仍存在。" \
              --prerelease
          fi

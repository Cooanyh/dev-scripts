name: Build StudyHelper v1.20.0 with dual OSS + upstream update channels

on:
  push:
    branches:
      - build/studyhelper-v120-oss-20261123
    paths:
      - 'chaoxingsignfaker/**'
      - '.github/workflows/chaoxingsignfaker-no-umeng.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: aquamarine5/ChaoxingSignFaker
          ref: 24fe193d03d2140d572eea3e58d27f7868504dcb
          path: upstream
          persist-credentials: false

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 37.0
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'

      - name: Apply no-Umeng patch
        run: |
          python3 chaoxingsignfaker/remove_umeng.py upstream
          ! grep -R -nE 'com\.umeng\.|MobclickAgent|UMConfigure\.getOaid' upstream/app/src/main/java
          grep -q 'android.intent.category.LAUNCHER' upstream/app/src/main/AndroidManifest.xml

      - name: Apply Course Check-in Assistant name and icon
        run: |
          python3 -m pip install --disable-pip-version-check cairosvg
          python3 chaoxingsignfaker/brand_course_assistant.py upstream
          grep -q '课程签到助手' upstream/app/src/main/res/values/strings.xml
          test -s upstream/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png


      - name: Apply priority OSS update channel
        run: |
          python3 chaoxingsignfaker/apply_dual_update_v120.py upstream

      - name: Configure stable signing if GitHub Secrets are present
        env:
          STUDYHELPER_KEYSTORE_BASE64: ${{ secrets.STUDYHELPER_KEYSTORE_BASE64 }}
          STUDYHELPER_KEYSTORE_PASSWORD: ${{ secrets.STUDYHELPER_KEYSTORE_PASSWORD }}
        run: |
          python3 chaoxingsignfaker/prepare_signing_v120.py upstream

      - name: Build Android APK
        working-directory: upstream
        env:
          GHP_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
          STUDYHELPER_KEYSTORE_PASSWORD: ${{ secrets.STUDYHELPER_KEYSTORE_PASSWORD }}
          STUDYHELPER_SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/studyhelper-release.p12
        run: |
          chmod +x gradlew
          if [ "$(cat studyhelper_signing_mode.txt)" = signed ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleRelease
          else
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Check compiled APK for Umeng components
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          mode=Path('upstream/studyhelper_signing_mode.txt').read_text().strip()
          apk=Path('upstream/app/build/outputs/apk/release/app-release.apk' if mode=='signed' else 'upstream/app/build/outputs/apk/debug/app-debug.apk')
          assert apk.exists(), 'Missing APK'
          flags=[b'Lcom/umeng/',b'com/umeng/',b'Lcom/efs/',b'Lcom/uc/crashsdk/']
          with zipfile.ZipFile(apk) as z:
              for path in z.namelist():
                  if path.endswith('.dex'):
                      data=z.read(path)
                      for flag in flags:
                          assert flag not in data, f'Remaining SDK reference: {flag} in {path}'
                  assert 'umeng' not in path.lower(), f'Remaining SDK asset: {path}'
          print('PASS: no common Umeng class/SDK traces; size:',apk.stat().st_size)
          PY

      - name: Create complete OSS upload package
        if: success()
        run: |
          python3 chaoxingsignfaker/make_oss_bundle_v120.py upstream output_dist
          find output_dist -maxdepth 5 -type f -printf '%P (%s bytes)\n'

      - name: Upload generated OSS package to GitHub Actions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StudyHelper-v120-OSS-outputs
          path: output_dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK and OSS package via GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MODE="$(cat upstream/studyhelper_signing_mode.txt)"
          if [ "$MODE" = signed ]; then
            TAG="studyhelper-v1.20.0-coren1"
            PACKAGE="output_dist/StudyHelper-OSS-READY-1.20.0-coren1.zip"
          else
            TAG="studyhelper-v1.20.0-coren1-preview"
            PACKAGE="output_dist/StudyHelper-OSS-PREVIEW-DO-NOT-UPLOAD.zip"
          fi
          DIR="output_dist/software/update/studyhelper"
          APK="$(find "$DIR" -maxdepth 1 -name '*.apk' -print -quit)"
          test -s "$APK" && test -s "$PACKAGE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$PACKAGE" "$DIR/stackbricks_manifest.json" "$DIR/SHA256SUMS.txt" --clobber
          else
            gh release create "$TAG" "$APK" "$PACKAGE" "$DIR/stackbricks_manifest.json" "$DIR/SHA256SUMS.txt" \
              --target "$GITHUB_SHA" \
              --title "课程签到助手 1.20.0-coren1 (${MODE})" \
              --notes "Un-official AGPL-3.0-derived StudyHelper based on upstream 1.20.0. Own OSS installable updates take priority; official channel retained read-only due signing differences. Requires stable GitHub Secrets before production OSS deployment. Source: https://github.com/Cooanyh/dev-scripts/tree/build/studyhelper-v120-oss-20261123/chaoxingsignfaker." \
              --prerelease
          fi
